name: Deploy site

# 每次 push 到 main 分支，自動重新建置並部署到兩個地方：
# GitHub Pages（jk347-byte.github.io/chiu-jianfu-campaign/）跟
# Cloudflare Pages（chiu-jianfu.pages.dev，團隊自己的帳號）。
# 給維護團隊：只要照 README 說明改 src/content/ 或 src/data/site.ts 的內容、
# commit、push 到 main，幾分鐘後兩邊網站都會自動更新，不需要手動部署。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Build for GitHub Pages
        run: npm run build -- --outDir dist-github
      - name: Build for Cloudflare Pages
        run: npm run build -- --outDir dist-cloudflare
        env:
          DEPLOY_TARGET: cloudflare
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-github
      - name: Ensure Cloudflare Pages project exists
        run: |
          if ! npx wrangler pages project list 2>&1 | grep -q "chiu-jianfu"; then
            npx wrangler pages project create chiu-jianfu --production-branch=main
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist-cloudflare --project-name=chiu-jianfu --branch=main --commit-dirty=true

  deploy-github-pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
